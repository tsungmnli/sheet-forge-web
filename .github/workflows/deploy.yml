name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: tsungmn/sheet-forge-web
  CONFIG_REPO: tsungmnli/sheet-forge-config
  CONFIG_DIR: overlays/web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 타입 검사와 빌드. (npm run lint는 현재 에러가 있어 넣지 않았다)
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-sheet-forge-web
      cancel-in-progress: false # never abandon a half-finished tag bump
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: tsungmn
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # CONFIG_REPO_TOKEN: fine-grained PAT, repo = sheet-forge-config only, Contents: Read and write.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set the new image tag
        working-directory: config/${{ env.CONFIG_DIR }}
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"

      - name: Commit and push (retry if another push landed first)
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CONFIG_DIR}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "tag already up to date"
            exit 0
          fi
          git commit -m "web: ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
